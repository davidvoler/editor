x-server-env: &server-env
  - POSTGRES_DB=polyglots
  - POSTGRES_PORT=5432
  - POSTGRES_HOST=postgres
  - POSTGRES_USER=polyglots
  - POSTGRES_PASSWORD=polyglots
  - POSTGRES_CONTENT_PASSWORD=polyglots
  - AUTH0_DOMAIN=${AUTH0_DOMAIN:-}
  - AUTH0_AUDIENCE=${AUTH0_AUDIENCE:-}
  - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:-}
  - ENABLE_DOCS=true
  - COOKIE_SECURE=false
  - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  - REDIS_HOST=redis
  - REDIS_PORT=6379
services:
  postgres:
    container_name: postgres
    image: postgres:17.4
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: polyglots
      POSTGRES_PASSWORD: polyglots
      POSTGRES_DB: polyglots
      shared_buffers: 4GB 
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    shm_size: 4GB

  server:
    container_name: server
    image: server:polyglots
    build:
      context: server
      dockerfile: Dockerfile.dev
    ports:
      - 8006:8006
    volumes:
      # Mounted at the host path so tracebacks point at real local files.
      # pytest suite (server/tests) — run with:
      #   docker compose exec -w /Users/davidle/dev/tutorial/editor/server server python -m pytest -q
      - ./server:/Users/davidle/dev/tutorial/editor/server
    environment: *server-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8006"
      - --reload
    depends_on:
      - postgres

  redis:
    container_name: redis
    hostname: redis
    image: redis:7.2
    ports:
      - 6379:6379


  broker:
    container_name: broker
    image: server:polyglots
    command:
      - taskiq
      - worker
      - tasks.broker:broker
      # task modules to import so their @broker.task fns register on the worker
      - tasks.prompt_tasks
      - -fsd
      - --log-level 
      - INFO
      - --reload
    volumes:
      - ./server:/Users/davidle/dev/tutorial/editor/server
    environment: *server-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
